# backend/pyproject.toml - Python project configuration

[project]
name = "nl2sql-backend"
version = "1.0.0"
description = "Natural Language to SQL Generator Backend"
authors = [{name = "Your Name", email = "your.email@example.com"}]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "langchain>=0.3.0",
    "langchain-mistralai>=0.1.0",
    "sqlalchemy>=2.0.23",
    "redis>=5.0.0",
    "chromadb>=0.4.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=. --cov-report=term-missing"

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "venv/*", "__pycache__/*"]
